# Hyperparameters
training:
  num_epochs: 50
  batch_size: 4
  lambda_adv: 1.0
  lambda_seg: 100.0
  lambda_pixel: 100.0
  lambda_consistency: 1.0
  alpha: 0.75
  real_label: 1.0
  fake_label: 0.0
  best_val_loss: 'inf'

dataset:
  train_labeled_csv: 'ID/supervised_training0.05.csv'
  train_unlabeled_csv: 'ID/unsupervised_training0.05.csv'
  val_csv: 'ID/val.csv'
  num_workers: 4
  pin_memory: true

model:
  generator:
    input_channels: 1
    output_channels: 1
    ngf: 64
  discriminator:
    input_channels: 1
    ndf: 64
    n_layers: 3
  segmenter:
    spatial_dims: 2
    in_channels: 1
    out_channels: 7  # Adjust based on your number of classes
    channels: [16, 32, 64, 128, 256]
    strides: [2, 2, 2, 2]

optimizer:
  generator:
    lr: 0.0002
    betas: [0.5, 0.999]
  discriminator:
    lr: 0.0002
    betas: [0.5, 0.999]
  segmenter:
    lr: 0.0002
    betas: [0.5, 0.999]

scheduler:
  step_size: 10
  gamma: 0.1

output:
  model_save_path: 'model_weights/SSL'
