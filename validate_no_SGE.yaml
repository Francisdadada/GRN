# Paths Configuration
paths:
  csv_file: 'ID/val.csv'                    # Path to the CSV file containing image and mask paths
  model_weights: 'model_weights/SEL/best_S.pth' # Path to the trained model weights
  output_dir: 'Results/0.05/GRN-SEL'       # Directory to save performance metrics

# DataLoader Configuration
dataloader:
  batch_size: 4             # Number of samples per batch
  num_workers: 4           # Number of subprocesses for data loading
  pin_memory: true         # Whether to copy Tensors into CUDA pinned memory

# Model Configuration
model:
  spatial_dims: 2          # Spatial dimensions of the input data
  in_channels: 1           # Number of input channels
  out_channels: 7          # Number of output classes
  channels: [16, 32, 64, 128, 256] # Number of channels in each layer
  strides: [2, 2, 2, 2]    # Strides for each layer

# Evaluation Metrics
metrics:
  num_classes: 7           # Total number of classes (including background)

# Confidence Interval
confidence_level: 0.95    # Confidence level for statistical intervals

