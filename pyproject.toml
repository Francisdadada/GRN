[project]
name = "grn-semi-supervised-segmentation"
version = "0.1.0"
description = "Generative Reinforcement Network demo for semi-supervised medical image segmentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "monai",
    "numpy",
    "scipy",
    "pillow",
    "SimpleITK",
    "albumentations",
    "opencv-python-headless",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]
mlops = [
    "mlflow",
    "boto3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "dataset",
    "model_weights",
    "utils",
    "jointtraining_semi_noenhance.py",
    "joint_training_joint_validation.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
